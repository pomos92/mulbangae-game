<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a3d">
<title>술게임 모임</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100dvh; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 16px 16px 40px; display: grid; grid-template-columns: 330px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  h1 { margin: 0 0 2px; font-size: 30px; letter-spacing: -1px; }
  #qr { background: #fff; border-radius: 16px; padding: 12px; aspect-ratio: 1; }
  #qr svg { width: 100%; height: auto; display: block; }
  #code { text-align: center; margin-top: 6px; } #code b { font-size: 22px; letter-spacing: 3px; color: var(--accent); }
  #link { word-break: break-all; font-size: 12px; text-align: center; margin-top: 4px; }
  #warn { display: none; margin-top: 10px; font-size: 13px; color: #ffcf8a; background: rgba(255,160,60,.12); padding: 10px; border-radius: 10px; }
  #qrwrap.mini #qrbody { display: none; }
  #qrtoggle { width: 100%; margin-bottom: 10px; font-size: 15px; padding: 10px; }
  #qrwrap:not(.mini) #qrtoggle::after { content: ' (접기)'; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { background: var(--c); color: #fff; font-weight: 800; padding: 4px 10px; border-radius: 999px; font-size: 14px; }
  .chip.off { opacity: .4; } .chip b { margin-left: 6px; cursor: pointer; opacity: .7; }
  #hostjoin.on { background: rgba(255,211,77,.18); color: var(--accent); }
  .sidebtns { display: flex; gap: 8px; margin-top: 8px; } .sidebtns button { flex: 1; font-size: 14px; padding: 10px 6px; }
  #gtitle { font-size: 24px; font-weight: 900; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  #back { font-size: 14px; padding: 9px 14px; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; } #controls:empty { display: none; }
  #controls button { flex: 1 1 auto; }
  .stage { min-height: 360px; position: relative; }
  #minewrap { margin-top: 16px; } #minewrap h3 { margin: 0 0 8px; font-size: 16px; color: var(--accent); }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .gcard { background: rgba(255,255,255,.08); color: var(--ink); text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,.12); }
  .gcard:hover { background: rgba(255,211,77,.14); }
  .gcard .ge { font-size: 40px; } .gcard b { font-size: 19px; } .gcard small { color: var(--muted); font-weight: 500; font-size: 13px; line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>🍻 술게임 모임</h1>
    <p class="muted" style="margin:0 0 12px">QR을 한 번 찍으면 모든 게임에 참가돼요</p>
    <div class="panel" id="qrwrap">
      <button id="qrtoggle" class="btn-sub">📱 참가 QR 보기</button>
      <div id="qrbody">
        <div id="qr"></div>
        <div id="code">참가 코드 <b id="codev">····</b></div>
        <div id="link" class="muted"></div>
      </div>
      <div id="warn"></div>
      <div style="margin-top:12px;font-weight:800">참가 <span id="cnt" style="color:var(--accent)">0</span>명</div>
      <div id="chips"></div>
      <button id="hostjoin" class="btn-sub" style="width:100%;font-size:15px;padding:11px">🙋 나도 참가 중</button>
      <div class="sidebtns"><button id="newroom" class="btn-sub">새 방 만들기</button><button id="mute" class="btn-sub" style="flex:0 0 56px">🔊</button></div>
    </div>
    <div id="adhost"></div>
  </div>
  <div class="panel">
    <div class="head"><span id="gtitle">🍻 게임 고르기</span><button id="back" class="btn-sub">☰ 게임 목록</button></div>
    <div id="controls"></div>
    <div id="stage" class="stage"></div>
    <div id="minewrap" style="display:none"><h3>🙋 내 자리</h3><div id="mine"></div></div>
  </div>
</div>
<script src="qrcode.js"></script>
<script src="mqtt.min.js"></script>
<script src="net.js"></script>
<script src="sound.js"></script>
<script src="beetle.js"></script>
<script src="common.js"></script>
<script src="games/beetle.js"></script>
<script src="games/bottle.js"></script>
<script src="games/cards.js"></script>
<script src="games/king.js"></script>
<script src="games/traps.js"></script>
<script src="games/liar.js"></script>
<script src="games/lowhigh.js"></script>
<script src="host.js"></script>
<script src="ads.js"></script>
<script>ADS.mount(document.getElementById('adhost'), 'host');</script>
</body>
</html>

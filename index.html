<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a3d">
<title>물방개 게임</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100dvh; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: -1px; display: flex; align-items: center; gap: 10px; }
  .panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: 20px; }
  #qr { background: #fff; border-radius: 16px; padding: 14px; display: flex; justify-content: center; aspect-ratio: 1; }
  #qr img, #qr svg { width: 100%; height: auto; image-rendering: pixelated; }
  #qr.closed { opacity: .25; filter: grayscale(1); }
  #link { word-break: break-all; font-size: 14px; margin-top: 10px; text-align: center; }
  #code { font-size: 15px; text-align: center; margin-top: 4px; }
  #code b { font-size: 22px; letter-spacing: 3px; color: var(--accent); }
  #warn { display: none; margin-top: 10px; font-size: 13px; color: #ffcf8a; background: rgba(255,160,60,.12); padding: 10px; border-radius: 10px; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  #start { font-size: 24px; padding: 18px; }
  .row { display: flex; gap: 8px; } .row button { flex: 1; font-size: 15px; padding: 12px 8px; }
  #phase { font-size: 20px; font-weight: 800; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  #phase span.n { color: var(--accent); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
  .tub { position: relative; aspect-ratio: 1; border-radius: 22px; border: 6px solid var(--c); box-shadow: inset 0 0 20px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center; transition: transform .2s; animation: drop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes drop { from { transform: scale(.3); opacity: 0; } }
  .tub .n { position: relative; z-index: 2; font-size: 34px; font-weight: 900; color: rgba(255,255,255,.85); text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .tub .off { position: absolute; top: 6px; right: 8px; z-index: 3; font-size: 11px; background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 6px; }
  .tub .x { position: absolute; top: 4px; left: 6px; z-index: 3; background: none; padding: 2px 6px; font-size: 14px; color: rgba(255,255,255,.6); display: none; }
  .lobby .tub:hover .x { display: block; }
  .tub .bt { position: absolute; z-index: 4; inset: 0; display: none; align-items: center; justify-content: center; }
  .tub.here { transform: scale(1.08); box-shadow: 0 0 0 4px #fff, 0 0 30px rgba(255,255,255,.6); }
  .tub.here .bt { display: flex; }
  .tub.here .n { opacity: .25; }
  .tub.win { transform: scale(1.12); box-shadow: 0 0 0 6px var(--accent), 0 0 50px rgba(255,211,77,.9); }
  .tub.win .bt { display: flex; }
  .tub.lose { opacity: .35; }
  #empty { text-align: center; padding: 60px 10px; font-size: 18px; }
  #empty .big { font-size: 64px; }
  #banner { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(5,20,30,.75); text-align: center; }
  #banner h2 { font-size: min(18vw, 160px); margin: 0; color: var(--accent); text-shadow: 0 0 40px rgba(255,211,77,.7); animation: pop .6s cubic-bezier(.2,2,.4,1); }
  #banner p { font-size: 28px; margin: 8px 0 24px; }
  #banner .row button { flex: none; font-size: 20px; padding: 14px 28px; white-space: nowrap; }
  #count { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; font-size: 30vmin; font-weight: 900; text-shadow: 0 6px 30px rgba(0,0,0,.5); pointer-events: none; }
  @keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>🪲 물방개 게임</h1>
    <p class="muted" style="margin:0 0 14px">QR을 찍으면 내 물방개 통이 켜져요</p>
    <div class="panel">
      <div id="qr"></div>
      <div id="code">참가 코드 <b id="codev">····</b></div>
      <div id="link" class="muted"></div>
      <div id="warn"></div>
      <div class="controls">
        <button id="start" class="btn-main" disabled>물방개 시작!</button>
        <div class="row">
          <button id="reopen" class="btn-sub">참가 다시 받기</button>
          <button id="newgame" class="btn-sub">새 게임</button>
        </div>
      </div>
    </div>
  </div>
  <div class="panel" id="board">
    <div id="phase"><span id="phaseText">참가자를 기다리는 중</span><span>참가 <span class="n" id="cnt">0</span>명</span></div>
    <div id="grid"></div>
    <div id="empty"><div class="big">📱</div>휴대폰 카메라로 QR을 찍어 주세요.<br><span class="muted">찍은 사람마다 통이 하나씩 생겨요.</span></div>
  </div>
</div>
<div id="count"></div>
<div id="banner"><h2 id="bTitle"></h2><p id="bSub">당첨!</p><div class="row" style="gap:12px"><button class="btn-main" id="again">한 판 더</button><button class="btn-sub" id="close">닫기</button></div></div>
<script src="qrcode.js"></script>
<script src="beetle.js"></script>
<script src="mqtt.min.js"></script>
<script src="net.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLORS = ['#3BA7E0', '#F2994A', '#6FCF97', '#EB5757', '#BB6BD9', '#F2C94C', '#56CCF2', '#FF8FB1',
  '#2D9CDB', '#27AE60', '#9B51E0', '#F06292', '#4DB6AC', '#FFB74D', '#7986CB', '#A1887F'];
const HK = 'mb2_host';
const params = new URLSearchParams(location.search);
let G = null;          // 게임 상태 (이 호스트 화면이 진행을 맡음)
let client = null, brokerUrl = null, state = null, runTimer = null;
const T = () => MB.PREFIX + G.room;

function save() { try { localStorage.setItem(HK, JSON.stringify({ ...G, players: G.players.map(p => ({ ...p, seen: 0 })) })); } catch (_) {} }
function restore() { try { return JSON.parse(localStorage.getItem(HK)); } catch (_) { return null; } }
function newGame() { return { room: MB.rid(6), phase: 'lobby', players: [], winner: null, round: 0, nextNum: 1 }; }
function setWarn(t, bad) { const w = $('warn'); w.style.display = t ? 'block' : 'none'; w.textContent = t || ''; w.style.color = bad ? '#ff9b9b' : ''; }

function online(p) { return Date.now() - (p.seen || 0) < 12000; }
function snapshot() {
  return { type: 'state', phase: G.phase, winner: G.winner, round: G.round,
    players: G.players.map(p => ({ id: p.id, num: p.num, color: p.color, online: online(p) })) };
}
function pub(sub, obj, retain) { if (client) client.publish(T() + sub, JSON.stringify(obj), { qos: 0, retain: !!retain }); }
function broadcast(m) { handle(m); pub('/ev', m); }
function broadcastState() { save(); const s = snapshot(); handle(s); pub('/state', s, true); }

// 참가자 → 호스트 메시지
function onUp(m) {
  if (!m || typeof m.pid !== 'string' || m.pid.length > 40) return;
  let p = G.players.find(x => x.id === m.pid);
  if (m.t === 'join') {
    if (!p) {
      if (G.phase !== 'lobby') { pub('/ev', { type: 'rejected', pid: m.pid }); return; }
      if (G.players.length >= 200) { pub('/ev', { type: 'rejected', pid: m.pid, full: true }); return; }
      const num = G.nextNum++;
      p = { id: m.pid, num, color: COLORS[(num - 1) % COLORS.length], seen: Date.now() };
      G.players.push(p);
    } else p.seen = Date.now();
    broadcastState();
  } else if (m.t === 'hb' && p) {
    const was = online(p); p.seen = Date.now();
    if (!was) broadcastState();
  }
}
// 연결 끊김 표시 갱신
setInterval(() => {
  if (!G || !state) return;
  const changed = G.players.some(p => { const o = state.players.find(x => x.id === p.id); return o && o.online !== online(p); });
  if (changed) broadcastState();
}, 3000);

function buildPath() {
  const ids = G.players.map(p => p.id);
  const win = ids[MB.randInt(ids.length)];
  const hops = ids.slice();
  for (let i = hops.length - 1; i > 0; i--) { const j = MB.randInt(i + 1); [hops[i], hops[j]] = [hops[j], hops[i]]; }
  const other = not => { let x; do { x = ids[MB.randInt(ids.length)]; } while (x === not); return x; };
  if (ids.length > 1) {
    const extra = Math.min(3 + MB.randInt(5), 2 + ids.length * 2);
    for (let k = 0; k < extra; k++) hops.push(other(hops[hops.length - 1]));
    if (hops[hops.length - 1] === win) hops.push(other(win));
    hops.push(win);
  } else hops.splice(0, hops.length, win);
  const n = hops.length;
  const durs = hops.map((_, i) => { const e = n - 1 - i; if (e === 0) return 2600; if (e <= 3) return [0, 1700, 1300, 1000][e]; return Math.max(450, 1300 - i * 120); });
  return { hops, durs, win };
}

function startBeetle() {
  if (!G.players.length || G.phase === 'running') return;
  const { hops, durs, win } = buildPath();
  clearTimeout(runTimer);
  G.phase = 'running'; G.winner = null; G.round++;
  const round = G.round;
  broadcastState();
  broadcast({ type: 'countdown', ms: 3000 });
  let i = 0;
  const step = () => {
    if (G.round !== round) return;
    if (i >= hops.length) {
      G.phase = 'done'; G.winner = win;
      const wp = G.players.find(p => p.id === win);
      broadcast({ type: 'winner', id: win, num: wp ? wp.num : null });
      broadcastState();
      return;
    }
    broadcast({ type: 'hop', id: hops[i], dur: durs[i], idx: i, total: hops.length, final: i === hops.length - 1 });
    runTimer = setTimeout(step, durs[i++]);
  };
  runTimer = setTimeout(step, 3000);
}

function showQR() {
  const u = new URL('join.html', location.href);
  u.search = ''; u.hash = '';
  u.searchParams.set('r', G.room);
  u.searchParams.set('b', MB.brokerParam(brokerUrl));
  const url = u.href;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  $('link').textContent = url;
  $('codev').textContent = G.room.toUpperCase();
}

async function init(fresh) {
  const saved = fresh ? null : restore();
  G = saved && saved.room ? saved : newGame();
  if (G.phase === 'running') G.phase = G.winner ? 'done' : 'lobby';
  save();
  setWarn('실시간 중계 서버에 연결하는 중…');
  if (!client) {
    const list = params.get('broker') ? [params.get('broker')] : (G.broker ? [G.broker, ...MB.BROKERS.filter(b => b !== G.broker)] : MB.BROKERS);
    try { const r = await MB.connectAny(list); client = r.client; brokerUrl = r.url; }
    catch (e) { setWarn('⚠️ ' + e.message + ' 잠시 후 다시 시도해요.', true); setTimeout(() => init(false), 4000); return; }
    client.on('message', (topic, buf) => {
      if (!G || topic !== T() + '/up') return;
      let m; try { m = JSON.parse(buf.toString()); } catch (_) { return; }
      onUp(m);
    });
    client.on('connect', () => { setWarn(''); subscribe(); broadcastState(); });
    client.on('offline', () => setWarn('⚠️ 인터넷 연결이 끊겼어요. 다시 연결하는 중…', true));
  }
  if (G.broker !== brokerUrl) { G.broker = brokerUrl; save(); }
  subscribe();
  setWarn('');
  showQR();
  broadcastState();
}
let subscribed = null;
function subscribe() {
  if (subscribed && subscribed !== T()) client.unsubscribe(subscribed + '/up');
  subscribed = T();
  client.subscribe(T() + '/up', { qos: 0 });
}

const host = async (action, extra) => {
  if (action === 'start') startBeetle();
  else if (action === 'reopen') { clearTimeout(runTimer); G.round++; G.phase = 'lobby'; G.winner = null; broadcastState(); }
  else if (action === 'kick') {
    const p = G.players.find(x => x.id === extra.pid);
    if (p) { pub('/ev', { type: 'kicked', pid: p.id }); G.players = G.players.filter(x => x !== p); broadcastState(); }
  } else if (action === 'end') {
    clearTimeout(runTimer); G.round++;
    pub('/ev', { type: 'ended' });
    if (client) client.publish(T() + '/state', '', { retain: true }); // 남아 있던 상태 지우기
  }
  return { ok: true, j: {} };
};

function render() {
  const s = state; if (!s) return;
  $('cnt').textContent = s.players.length;
  $('empty').style.display = s.players.length ? 'none' : 'block';
  $('board').className = 'panel ' + s.phase;
  $('qr').className = s.phase === 'lobby' ? '' : 'closed';
  $('phaseText').textContent = { lobby: '참가자를 기다리는 중', running: '물방개가 돌아다니는 중…', done: '결과 발표!' }[s.phase];
  $('start').disabled = s.phase === 'running' || s.players.length === 0;
  $('start').textContent = s.phase === 'done' ? '같은 멤버로 한 판 더' : '물방개 시작!';
  $('reopen').disabled = s.phase !== 'done';
  const grid = $('grid');
  const have = new Set();
  s.players.forEach(p => {
    have.add(p.id);
    let el = grid.querySelector(`[data-id="${p.id}"]`);
    if (!el) {
      el = document.createElement('div'); el.className = 'tub water'; el.dataset.id = p.id;
      el.style.setProperty('--c', p.color);
      el.innerHTML = `<button class="x" title="빼기">✕</button><span class="n">${p.num}</span><span class="off">연결 끊김</span><div class="bt">${beetleSVG(48)}</div>`;
      el.querySelector('.x').onclick = () => { if (confirm(`${p.num}번 통을 뺄까요?`)) host('kick', { pid: p.id }); };
      grid.appendChild(el);
    }
    el.querySelector('.off').style.display = p.online ? 'none' : 'block';
    el.classList.toggle('win', s.phase === 'done' && s.winner === p.id);
    el.classList.toggle('lose', s.phase === 'done' && s.winner && s.winner !== p.id);
    if (s.phase !== 'running') el.classList.remove('here');
  });
  grid.querySelectorAll('.tub').forEach(el => { if (!have.has(el.dataset.id)) el.remove(); });
}

function handle(m) {
  if (m.type === 'state') { state = m; render(); if (m.phase !== 'done') $('banner').style.display = 'none'; }
  else if (m.type === 'countdown') { let n = Math.round(m.ms / 1000); const c = $('count'); c.style.display = 'flex';
    const t = () => { if (n <= 0) { c.style.display = 'none'; return; } c.textContent = n--; setTimeout(t, 1000); }; t(); }
  else if (m.type === 'hop') {
    document.querySelectorAll('.tub.here').forEach(e => e.classList.remove('here'));
    const el = document.querySelector(`.tub[data-id="${m.id}"]`);
    if (el) { el.classList.add('here'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  else if (m.type === 'winner') {
    document.querySelectorAll('.tub.here').forEach(e => e.classList.remove('here'));
    setTimeout(() => { $('bTitle').textContent = `${m.num}번 통`; $('bSub').textContent = '🎉 당첨! 🎉'; $('banner').style.display = 'flex'; }, 400);
  }
}

$('start').onclick = () => { if (!G.players.length) return alert('참가자가 없어요.'); host('start'); };
$('again').onclick = () => { $('banner').style.display = 'none'; host('start'); };
$('close').onclick = () => { $('banner').style.display = 'none'; };
$('reopen').onclick = () => host('reopen');
$('newgame').onclick = async () => { if (!confirm('새 게임을 만들까요? 지금 참가자들은 모두 나가게 돼요.')) return; await host('end'); $('grid').innerHTML = ''; init(true); };
init(false);
</script>
</body>
</html>

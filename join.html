<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b2a3d">
<title>술게임 참가</title>
<link rel="stylesheet" href="style.css">
<style>
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: max(10px, env(safe-area-inset-top)) 14px 6px; display: flex; align-items: center; gap: 10px; }
  #me { font-size: 18px; padding: 4px 12px; }
  #gname { font-weight: 900; font-size: 18px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { padding: 0 14px; font-size: 16px; font-weight: 700; min-height: 1.4em; text-align: center; }
  #stage { flex: 1; position: relative; overflow: auto; padding: 8px 14px max(70px, calc(env(safe-area-inset-bottom) + 64px)); display: flex; flex-direction: column; }
  #err { display: none; position: fixed; inset: 0; z-index: 60; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 20px; background: var(--bg); }
  #snd { position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 6px 20px rgba(0,0,0,.4); font-size: 16px; padding: 11px 18px; border-radius: 999px; }
  #snd.on { background: rgba(0,0,0,.45); color: #fff; font-size: 14px; padding: 7px 12px; }
  .lobbytub { flex: 1; border-radius: 32px; border: 10px solid var(--c); display: flex; align-items: center; justify-content: center; flex-direction: column; min-height: 50vh; }
  .lobbytub .n { position: relative; z-index: 2; font-size: 30vmin; font-weight: 900; color: rgba(255,255,255,.4); line-height: 1; }
  .lobbytub .t { position: relative; z-index: 2; font-size: 18px; color: rgba(255,255,255,.8); margin-top: 6px; }
</style>
</head>
<body>
<header><span id="me" class="tag">…</span><span id="gname">술게임 모임</span></header>
<div id="status">연결하는 중…</div>
<div id="stage"></div>
<button id="snd">🔊 눌러서 소리 켜기</button>
<div id="err"></div>
<script src="mqtt.min.js"></script>
<script src="net.js"></script>
<script src="sound.js"></script>
<script src="beetle.js"></script>
<script src="common.js"></script>
<script src="games/beetle.js"></script>
<script src="games/bottle.js"></script>
<script src="games/cards.js"></script>
<script src="games/king.js"></script>
<script src="games/traps.js"></script>
<script src="games/liar.js"></script>
<script src="games/lowhigh.js"></script>
<script src="ads.js"></script>
<script src="player.js"></script>
</body>
</html>
